# Pilum telemetry: receives opt-in CLI events at t.pilum.dev and forwards
# them to the "Pilum CLI" PostHog project. See README.md.
name = "pilum-metrics-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

routes = [{ pattern = "t.pilum.dev", custom_domain = true }]

[vars]
POSTHOG_HOST = "https://us.i.posthog.com"
# "false" answers every client with accept:false, which pauses sending for a week.
COLLECTION_ENABLED = "true"
# POSTHOG_KEY is a secret: wrangler secret put POSTHOG_KEY

# 60 batches a minute per install ID. A real run sends one.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7301"
simple = { limit = 60, period = 60 }

# Tallies of accepted, forwarded and dropped events, for watching the Worker
# without PostHog. No identifiers. Analytics Engine has to be enabled on the
# account first (dashboard > Workers > Analytics Engine); until then the code
# skips the tallies.
# [[analytics_engine_datasets]]
# binding = "METRICS"
# dataset = "pilum_metrics"

# Request logs off: the Worker should not keep client IPs anywhere.
[observability]
enabled = false
